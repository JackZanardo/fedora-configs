# Starship prompt config inspired by oh-my-posh "atomic" theme
# Uses dynamic terminal palette colors — segments adapt to any terminal color scheme
# (Catppuccin, Dracula, Gruvbox, Nord, Solarized, Tokyo Night, etc.)
#
# Color mapping (atomic role → terminal ANSI slot):
#   Shell badge      → bg:blue          fg:bright-white
#   Root/username    → bg:red           fg:bright-yellow
#   Directory        → bg:yellow        fg:black
#   Git branch       → bg:green         fg:black
#   Git status       → bg:bright-green  fg:black
#   Node.js          → bg:bright-green  fg:black
#   Python           → bg:blue          fg:bright-white
#   Rust             → bg:red           fg:bright-white
#   Go               → bg:cyan          fg:black
#   Java             → bg:yellow        fg:black
#   .NET             → bg:magenta       fg:bright-white
#   Time (right)     → bg:blue          fg:bright-white
#   Connectors/lines → blue
#   Errors           → red
#
# Requires a Nerd Font: https://www.nerdfonts.com/
# Install starship:     https://starship.rs/guide/
# Place at:             ~/.config/starship.toml

# ── Top-level format ──────────────────────────────────────────────────────────
format = """
[╭─](bold blue)\
$shell\
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$java\
$dotnet\
$cmd_duration\
$fill\
$time\
$line_break\
[╰─](bold blue)$status$character"""

# ── Shell segment ─────────────────────────────────────────────────────────────
[shell]
disabled = false
format = "[ $indicator ]($style)"
style = "bg:blue fg:bright-white bold"
bash_indicator = " bash"
zsh_indicator = " zsh"
fish_indicator = " fish"
powershell_indicator = "  pwsh"
unknown_indicator = " shell"

# ── Username (shown when root or SSH) ─────────────────────────────────────────
[username]
disabled = false
show_always = false
format = "[ 󱐋 $user ]($style)"
style_root = "bg:red fg:bright-yellow bold"
style_user = "bg:red fg:bright-yellow bold"

# ── Directory ─────────────────────────────────────────────────────────────────
[directory]
format = "[ 󰉖 $path ]($style)[](fg:yellow)"
style = "bg:yellow fg:black bold"
truncation_length = 3
truncate_to_repo = false
home_symbol = "󱂵 ~"
read_only = " 󰌾"
read_only_style = "bg:yellow fg:black"

# ── Git branch ────────────────────────────────────────────────────────────────
[git_branch]
format = "[ $symbol$branch(:$remote_branch) ]($style)[](fg:green)"
style = "bg:green fg:black bold"
symbol = " "

# ── Git status ────────────────────────────────────────────────────────────────
[git_status]
format = '([ $all_status$ahead_behind ]($style)[](fg:bright-green))'
style = "bg:bright-green fg:black bold"
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "󰏗 ${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ── Node.js ───────────────────────────────────────────────────────────────────
[nodejs]
format = "[ $symbol$version ]($style)[](fg:bright-green)"
style = "bg:bright-green fg:black bold"
symbol = " "

# ── Python ────────────────────────────────────────────────────────────────────
[python]
format = "[ $symbol$version(\\($virtualenv\\)) ]($style)[](fg:blue)"
style = "bg:blue fg:bright-white bold"
symbol = " "

# ── Rust ──────────────────────────────────────────────────────────────────────
[rust]
format = "[ $symbol$version ]($style)[](fg:red)"
style = "bg:red fg:bright-white bold"
symbol = " "

# ── Go ────────────────────────────────────────────────────────────────────────
[golang]
format = "[ $symbol$version ]($style)[](fg:cyan)"
style = "bg:cyan fg:black bold"
symbol = " "

# ── Java ──────────────────────────────────────────────────────────────────────
[java]
format = "[ $symbol$version ]($style)[](fg:yellow)"
style = "bg:yellow fg:black bold"
symbol = " "

# ── .NET ──────────────────────────────────────────────────────────────────────
[dotnet]
format = "[ $symbol$version(󱁆 $tfm) ]($style)[](fg:magenta)"
style = "bg:magenta fg:bright-white bold"
symbol = "󰪮 "

# ── Command duration ──────────────────────────────────────────────────────────
[cmd_duration]
format = "[ 󱦟 $duration ]($style)"
style = "fg:bright-black bold"
min_time = 2_000
show_milliseconds = false

# ── Fill (pushes time to the right) ───────────────────────────────────────────
[fill]
symbol = " "

# ── Time (right-aligned) ──────────────────────────────────────────────────────
[time]
disabled = false
format = "[ 󰥔 $time ]($style)"
style = "bg:blue fg:bright-white bold"
time_format = "%H:%M:%S"
use_12hr = false

# ── Status (exit code) ────────────────────────────────────────────────────────
[status]
disabled = false
format = "[$symbol]($style) "
style = "fg:red bold"
symbol = "✘ $status"
success_symbol = ""
not_executable_symbol = "🚫"
not_found_symbol = "󰍉"
sigint_symbol = "󰚌"
signal_symbol = "⚡"
map_symbol = true

# ── Prompt character (second line) ────────────────────────────────────────────
[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# ── Newline ───────────────────────────────────────────────────────────────────
[line_break]
disabled = false
